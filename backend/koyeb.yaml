services:
  - name: velog-backend
    type: web
    git:
      branch: main
      build_command: npm run build
      run_command: npm run start:prod
    instance_type: nano
    env:
      - PORT=8000
      - NODE_ENV=production
    scaling:
      min: 1
      max: 1
    health_checks:
      http:
        path: /
        port: 8000