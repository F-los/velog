services:
  - name: velog-backend
    type: web
    git:
      branch: main
      run_command: npm run start:prod
    instance_type: nano
    env:
      - PORT=8000
      - NODE_ENV=production
      - DISABLE_DB=false
    scaling:
      min: 1
      max: 1
    health_checks:
      http:
        path: /
        port: 8000